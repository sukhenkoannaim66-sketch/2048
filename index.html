<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Класична гра 2048 'PIPIKIWI' у браузері">
  <meta name="theme-color" content="#faf8ef">
  <title>PIPIKIWI </title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/tiles/2.webp">
  <link rel="preload" as="image" href="assets/tiles/4.webp">
  <link rel="preload" as="image" href="assets/tiles/8.webp">
  <link rel="preload" as="image" href="assets/tiles/16.webp">
  <link rel="preload" as="image" href="assets/tiles/32.webp">
  <link rel="preload" as="image" href="assets/tiles/64.webp">
  <link rel="preload" as="image" href="assets/tiles/128.webp">
  <link rel="preload" as="image" href="assets/tiles/256.webp">
  <link rel="preload" as="image" href="assets/tiles/512.webp">
  <link rel="preload" as="image" href="assets/tiles/1024.webp">
  <link rel="preload" as="image" href="assets/tiles/2048.webp">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="game__header">
      <h1>PIPIKIWI </h1>
      <div class="scores">
        <div class="score-box">Рахунок <span id="score" aria-live="polite">0</span></div>
        <div class="score-box">Рекорд <span id="best">0</span></div>
      </div>
    </header>

    <button id="new-game" type="button">Нова гра</button>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="Ігрове поле"></div>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-text"></p>
        <button id="overlay-btn" type="button">Спробувати ще</button>
      </div>
    </div>

    <p class="hint">Стрілки або свайп: рухайте плитки. Однакові числа зливаються.</p>
  </main>

  <noscript>Для гри потрібен увімкнений JavaScript.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
